<body class="min-h-screen flex flex-col items-center justify-center font-body-md text-on-surface p-margin-mobile md:p-margin-desktop overflow-x-hidden">
<div class="ambient-glow-top"></div>

<main class="w-full max-w-[420px] z-10">
<!-- Heading -->
<div class="text-center mb-10">
<h2 class="font-headline-md text-headline-md text-on-surface">
                Welcome <span class="italic text-primary-container font-display-lg">back</span>
</h2>

</div>
<!-- Glassmorphism Login Card -->
<div class="glass-card rounded-xl p-8 shadow-2xl">
<!-- Google SSO -->
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 border border-outline-variant hover:bg-surface-container-high transition-colors duration-300 rounded-lg group">

<div class="flex-grow border-t border-white/5"></div>
<span class="flex-shrink mx-4 font-label-sm text-outline uppercase tracking-widest">or</span>
<div class="flex-grow border-t border-white/5"></div>
</div>
<!-- Form Fields -->
<form class="space-y-6">
<div>
<label class="block font-label-sm text-outline mb-2 ml-1" for="email">Email</label>
<input class="w-full bg-surface-container-lowest border border-white/10 rounded-lg py-3 px-4 text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all duration-300 placeholder:text-surface-variant" id="email" placeholder="name@company.com" type="email"/>
</div>
<div>
<div class="flex justify-between items-center mb-2 px-1">
<label class="font-label-sm text-outline" for="password">Password</label>
<a class="font-label-sm text-primary-container hover:text-primary transition-colors duration-200" href="#">Forgot your password?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-white/10 rounded-lg py-3 px-4 text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all duration-300 placeholder:text-surface-variant" id="password" placeholder="••••••••" type="password"/>

<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>

</div>
</div>
