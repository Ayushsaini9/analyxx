name: Keep Render Services Alive

on:
  schedule:
    # Ping every 14 minutes to prevent Render free tier cold starts
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          curl -sf --max-time 60 https://analyxx-backend.onrender.com/health || echo "Backend ping failed"

